name: Build, test and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamcell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile portable executable
        shell: powershell
        run: ./build.ps1
      - name: Check frontend syntax
        shell: powershell
        run: |
          node --check wwwroot/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check wwwroot/admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check wwwroot/shared.js
          exit $LASTEXITCODE
      - name: Check PC and phone boundaries
        run: node tests/smoke.mjs
      - name: Check OBS protocol with simulated server
        run: node tests/obs-integration.cjs
      - name: Publish new version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content -Raw Program.cs
          $version = [regex]::Match($source, 'const string Version = "([0-9.]+)"').Groups[1].Value
          if (-not $version) { throw 'Version missing' }
          $tag = 'v' + $version
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing releases' }
          if (($releases | ConvertFrom-Json).tagName -contains $tag) { Write-Output 'Version already released'; exit 0 }
          Compress-Archive -Path build/StreamCell.exe,README.md -DestinationPath build/StreamCell-Windows.zip
          $hash = (Get-FileHash build/StreamCell.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash + '  StreamCell.exe') | Set-Content build/SHA256SUMS.txt -Encoding ascii
          gh release create $tag build/StreamCell.exe build/StreamCell-Windows.zip build/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('StreamCell ' + $version) --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }

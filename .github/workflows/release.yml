name: Build and release StreamCell
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: streamcell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build Windows desktop app
        shell: powershell
        run: ./build.ps1
      - name: Check JavaScript syntax
        shell: powershell
        run: |
          node --check wwwroot/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check wwwroot/admin.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check wwwroot/shared.js
          exit $LASTEXITCODE
      - name: Verify PC and phone boundaries
        run: node tests/smoke.mjs
      - name: Verify OBS protocol
        run: node tests/obs-integration.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-build
          path: build/StreamCell.exe
          if-no-files-found: error
          retention-days: 3
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.9'
      - name: Build Android app
        run: gradle --no-daemon --stacktrace :app:assembleRelease
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-build
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-build
          path: build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-build
          path: build
      - name: Publish versioned downloads
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content -Raw Program.cs
          $version = [regex]::Match($source, 'const string Version = "([0-9.]+)"').Groups[1].Value
          if (-not $version) { throw 'Version missing' }
          $tag = 'v' + $version
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --json tagName --limit 100
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read existing releases' }
          if (($releases | ConvertFrom-Json).tagName -contains $tag) { Write-Output 'Version already released'; exit 0 }
          Rename-Item build/app-release.apk StreamCell-Android.apk
          Compress-Archive -Path build/StreamCell.exe,README.md,SECURITY.md -DestinationPath build/StreamCell-Windows.zip
          $winHash = (Get-FileHash build/StreamCell.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $apkHash = (Get-FileHash build/StreamCell-Android.apk -Algorithm SHA256).Hash.ToLowerInvariant()
          ($winHash + '  StreamCell.exe' + [Environment]::NewLine + $apkHash + '  StreamCell-Android.apk') | Set-Content build/SHA256SUMS.txt -Encoding ascii
          gh release create $tag build/StreamCell.exe build/StreamCell-Windows.zip build/StreamCell-Android.apk build/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ('StreamCell ' + $version) --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }